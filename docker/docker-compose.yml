# =====================================================================
# 田冲助农商城 - 生产级编排
#   cp docker/env.docker.example .env.docker && vim .env.docker
#   docker compose --env-file .env.docker up -d --build
#   访问: http://<host>:8080/        H5 用户端
#         http://<host>:8080/manage/ 管理后台
#         http://<host>:8080/api/... PHP API（nginx 反代到 php-fpm）
#
# 结构:
#   db   - MariaDB 10.11（自动初始化 sql/nongxian_mall.sql，数据落卷）
#   app  - php-fpm + cron（对内 9000，仅 web 可达）
#   web  - nginx（对外 8080，静态前端 + FastCGI 反代）
# =====================================================================

services:
  db:
    image: mariadb:10.11
    container_name: nongxian-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 .env.docker 中设置 DB_ROOT_PASSWORD}
      MARIADB_DATABASE: nongxian_mall
      MARIADB_USER: ${DB_USER:-nongxian}
      MARIADB_PASSWORD: ${DB_PASSWORD:?请在 .env.docker 中设置 DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - db_data:/var/lib/mysql
      # 首次启动自动建库建表（/docker-entrypoint-initdb.d 按字母序执行）
      - ./sql/nongxian_mall.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [mall]

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
    image: nongxian-mall/app:latest
    container_name: nongxian-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: nongxian_mall
      DB_USER: ${DB_USER:-nongxian}
      DB_PASS: ${DB_PASSWORD:?请在 .env.docker 中设置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env.docker 中设置 JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_DEBUG: ${APP_DEBUG:-0}
      TZ: Asia/Shanghai
    volumes:
      # 上传文件与 nginx 共享（读写）
      - uploads:/var/www/html/api/public/uploads
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/healthcheck.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [mall]

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    image: nongxian-mall/web:latest
    container_name: nongxian-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # 与 app 共享上传目录（只读）
      - uploads:/var/www/html/api/public/uploads:ro
    networks: [mall]

volumes:
  db_data:
  uploads:

networks:
  mall:
    driver: bridge
