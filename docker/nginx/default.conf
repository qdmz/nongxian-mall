# =====================================================================
# 田冲助农商城 - Nginx 站点配置（容器内）
# /            → h5/dist（hash 路由，回退 index.html）
# /manage      → admin/dist（history 路由，回退 /manage/index.html）
# /api /admin  → FastCGI → app:9000（public/index.php 入口）
# /uploads     → 上传目录（nginx 缓存友好，app 写入）
# =====================================================================

server {
    listen 80;
    server_name _;

    root /var/www/html/h5/dist;
    index index.html;

    client_max_body_size 20m;

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # ---------- PHP API（/api /admin /uploads 动态/上传） ----------
    # uploads：上传目录（卷挂载，nginx 静态直出）
    location /uploads/ {
        alias /var/www/html/api/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP API 统一入口：所有 /api、/admin 请求交给 public/index.php
    location ~ ^/(api|admin)(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/api/public;
        fastcgi_read_timeout 60s;
        # 传递真实 Host，支付回调 getBaseUrl() 依赖它
        fastcgi_param HTTP_HOST $host;
    }

    # ---------- 管理后台 /manage（history 路由 fallback） ----------
    location /manage {
        alias /var/www/html/admin/dist;
        try_files $uri $uri/ /manage/index.html;
    }
    # /manage 精确路径 → index.html（alias 目录语义）
    location = /manage {
        rewrite ^ /manage/index.html last;
    }

    # ---------- H5 用户端（hash 路由，全部回退 index.html） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite hash 文件名）
    location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全：拒绝隐藏文件
    location ~ /\.(ht|git|env) {
        deny all;
    }
}
