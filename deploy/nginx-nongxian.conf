# 田冲助农商城 - Nginx 配置
# 域名：qiniu.ypvps.com
# 架构：H5(/) + Admin(/manage/) + API(/api/ + /admin/) + 上传(/uploads/)

# HTTP -> HTTPS
server {
    listen 80;
    server_name qiniu.ypvps.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name qiniu.ypvps.com;

    # 复用 acme.sh 申请的证书
    ssl_certificate     /root/.acme.sh/qiniu.ypvps.com/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/qiniu.ypvps.com/qiniu.ypvps.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 默认根：H5 用户端
    root /var/www/nongxian/h5/dist;
    index index.html;

    # 上传/静态资源（图片等）
    location /uploads/ {
        alias /var/www/nongxian/api/public/uploads/;
        access_log off;
        expires 30d;
    }

    # 管理后台前端（history SPA，base /manage/）
    location /manage/ {
        alias /var/www/nongxian/admin/dist/;
        try_files $uri $uri/ /manage/index.html;
        access_log off;
    }

    # 用户端 API
    location /api/ {
        root /var/www/nongxian/api/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 管理后台 API
    location /admin/ {
        root /var/www/nongxian/api/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        root /var/www/nongxian/api/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60;
    }

    # H5 SPA 回退（放最后，兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全：禁止访问隐藏文件
    location ~ /\.(ht|git|env|md)$ {
        deny all;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}
