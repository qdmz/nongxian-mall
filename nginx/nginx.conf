server {
    listen 80;
    server_name your-domain.com;
    root /www/wwwroot/nongxian-mall;
    index index.html index.php;

    # 上传大小限制
    client_max_body_size 20m;

    # H5 前端（直接放根目录）
    location / {
        try_files $uri $uri/ /index.html;
        root /www/wwwroot/nongxian-mall/h5/dist;
    }

    # 管理后台
    location /admin-panel {
        alias /www/wwwroot/nongxian-mall/admin/dist;
        try_files $uri $uri/ /admin-panel/index.html;
    }

    # API 后端
    location /api {
        # 如果后端用子目录部署，改为 alias
        root /www/wwwroot/nongxian-mall/api/public;
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # 管理后台 API
    location /admin {
        root /www/wwwroot/nongxian-mall/api/public;
        try_files $uri $uri/ /admin/index.php?$query_string;
    }

    # 上传文件访问
    location /uploads {
        root /www/wwwroot/nongxian-mall/api/public;
    }

    # PHP-FPM
    location ~ \.php$ {
        root /www/wwwroot/nongxian-mall/api/public;
        fastcgi_pass unix:/tmp/php-cgi-74.sock;  # 按实际 php-fpm 配置改
        # fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全：禁止访问敏感文件
    location ~ /\.(ht|git|env) {
        deny all;
    }

    location ~ /(config|core|models|controllers|services|middleware|routes|runtime) {
        deny all;
    }

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
