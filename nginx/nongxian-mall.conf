# 2026-10-14 安全加固版（原文件备份：/root/mall-backup-20261014/nginx-nongxian-mall.conf）
# 变更：API 统一只走 index.php（原 alias 方式可直接执行 cron.php 等任意 PHP 文件）；
#       去掉与 PHP 重复的 CORS 头；增加安全头；index.html 不缓存；禁止访问隐藏文件；上传大小与后端配置一致。
server {
    listen 80;
    server_name qiniu.ypvps.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name qiniu.ypvps.com;

    ssl_certificate /game/certs/cert.pem;
    ssl_certificate_key /game/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/nongxian-mall/h5;
    index index.html;
    server_tokens off;
    client_max_body_size 12m;

    include /etc/nginx/snippets/nongxian-security-headers.conf;

    # 隐藏文件（.git/.env/.htaccess 等）一律拒绝
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # 上传文件（纯静态，不执行任何脚本）
    location /uploads/ {
        alias /var/www/nongxian-mall/api/public/uploads/;
        autoindex off;
        expires 30d;
        include /etc/nginx/snippets/nongxian-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin *;
        location ~* \.(php|phtml|phar|pl|py|cgi|sh|html?|svg)$ { return 403; }
    }

    # H5 入口页不缓存（发版后用户立即拿到新版本）
    location = /index.html {
        include /etc/nginx/snippets/nongxian-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # H5 前端 (用户端)
    location / {
        try_files $uri $uri/ /index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 30d;
            include /etc/nginx/snippets/nongxian-security-headers.conf;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
        }
    }

    # Admin 前端 (管理后台)
    location = /manage/index.html {
        alias /var/www/nongxian-mall/admin/index.html;
        include /etc/nginx/snippets/nongxian-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location /manage/ {
        alias /var/www/nongxian-mall/admin/;
        try_files $uri /manage/index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 30d;
            include /etc/nginx/snippets/nongxian-security-headers.conf;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
        }
    }

    # 用户端 API：所有请求只交给前端控制器 index.php，不再按文件路径执行/下发 api 目录下任何文件
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/nongxian-mall/api/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PHP_VALUE "upload_max_filesize=10M
post_max_size=12M";
        fastcgi_read_timeout 60s;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # 管理端 API
    location ^~ /admin/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/nongxian-mall/api/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PHP_VALUE "upload_max_filesize=10M
post_max_size=12M";
        fastcgi_read_timeout 60s;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
